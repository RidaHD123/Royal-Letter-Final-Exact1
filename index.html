إِلَى مَقَامِ حَضْرَةِ صَاحِبِ الجَلَالَةِ المُعَظَّمِ
خَادِمِ الحَرَمَيْنِ الشَّرِيفَيْنِ
المَلِكِ سَلْمَانَ بْنِ عَبْدِ العَزِيزِ آلِ سُعُودٍ
أَيَّدَهُ اللهُ

من: رضا حمادة - المملكة المغربية
الموضوع: طلب التوجيه السامي الكريم لمشروع صناعي عالمي في الذهب والمجوهرات - انطلاقاً من مملكة بلجيكا الصديقة

السلام عليكم ورحمة الله وبركاته،

مولاي صاحب الجلالة المعظم،

أتشرف برفع هذه الرسالة إلى مقامكم السامي، ملتمساً أن تحظى بنظركم الكريم.

أولاً - في الإشادة بمملكة بلجيكا:

إن من دواعي الشرف أن أحيط مقامكم علماً بأن هذا المشروع المقترح قد حظي بترحيب ملكي كريم من لدن صاحب الجلالة الملك فيليب، ملك البلجيكيين
Sa Majesté le Roi Philippe, Roi des Belges
وصاحبة السمو الملكي الأميرة إليزابيث، دوقة برابانت، ولية عهد بلجيكا
Son Altesse Royale la Princesse Élisabeth, Duchesse de Brabant

حيث تفضلا بتوجيه رسالتين ملكيتين ترحيبيتين رسميتين، تضمنتا الترحيب بالمشروع على أراضي مملكة بلجيكا، والإيمان برؤيته. وإنني إذ أرفع هذا إلى مقامكم، فإنما أرفعه اعتزازاً بالدور الريادي الذي تقوم به مملكتكم العامرة في دعم المبادرات النوعية، وبما يجعل مملكة بلجيكا شريكاً فخوراً بعنايتكم السامية، في أرض مباركة تشاطر المملكة العربية السعودية والمملكة المغربية قيم العمل والعراقة.

بلجيكا بلد محترم بملك ذي قلب كبير، وأتشرف بأن أنوه به في نفس المقام الشريف الذي تحمله جلالتكم وجلالة ملك المغرب.

ثانياً - في صلب المشروع:

المشروع هو إنشاء أقوى شركة عالمية متخصصة في صناعة وتسويق الذهب والمجوهرات الفاخرة، تقوم على تحويل الذهب إلى منتجات ملموسة فاخرة، كأفضل استثمار آمن، يحفظ سمعة المستثمرين وسكينة الصناديق الاستثمارية، في وقت يشهد العالم تقلبات في الفائدة والسندات.

وفلسفة المشروع تقوم على أن الاستثمار في الأصول الملموسة والفاخرة هو المكسب الحقيقي، وأن العمل بمنهجية منظمات الأمم المتحدة هو سبيل النجاح حتى في أوقات الأزمات.

المشروع يستهدف شريحة الأثرياء والبلاطات الملكية، وإن السؤال الجوهري هو من سيكون في طليعة هذه البلاطات الداعمة. وإن بدء التنفيذ برسالتي الترحيب من بلجيكا يجعل السلطات هناك جاهزة لاستقباله.

ثالثاً - ما ألتمسه من مقامكم الكريم:

ألتمس من جلالتكم التفضل برعاية هذا المشروع بعنايتكم، وبعناية أفراد الأسرة المالكة السعودية الكريمة، سواء عبر توجيه كريم لمستثمرين لا يعرفون المستحيل، من أباطرة النفوذ والثروات الهائلة في المملكة، لتوجيه استثماراتهم نحو بلجيكا، بالشراكة والحصة والدعم، أو عبر دعم مباشر من البلاط الموقر وفق ما ترونه جلالتكم مناسباً.

وإن لم يتوفر دعم مباشر، فتوجيه كريم منكم نحو تلك النخب الاستثمارية كفيل بجعله مشروعاً عالمياً، فلن يكون عالمياً بدونكم يا مولاي.

وأحيط مقامكم علماً بأنني لم أتواصل بخصوص هذا المشروع مع دولة الإمارات ولا مع الصين ولا مع جهات أخرى، سوى مع البيت الأبيض لدى فريق إدارة الرئيس ترامب Trump Administration، ومع البلاط المغربي، والبلاط البلجيكي، وبلاطكم العامر بصفتكم ملك العالم الإسلامي والعربي.

وتفضلوا بقبول فائق الاحترام والتقدير،

`)},en:{dir:"ltr",bismillah:"In the name of God, the Most Gracious, the Most Merciful",lines:["In the name of God, the Most Gracious, the Most Merciful","","TO THE PRESENCE OF HIS EXALTED MAJESTY","THE CUSTODIAN OF THE TWO HOLY MOSQUES","KING SALMAN BIN ABDULAZIZ AL SAUD","May God uphold him","","From: Rida Hamada - Kingdom of Morocco","Subject: Request for the Gracious High Guidance for a global industrial project in gold and jewelry - starting from the friendly Kingdom of Belgium","","Peace, mercy and blessings of God be upon you,","","My Lord, Your Most Exalted Majesty,","","I am honored to submit this letter to your high station, hoping it will receive your gracious consideration.","","First - In praise of the Kingdom of Belgium:","","It is an honor to inform your station that this proposed project has received a gracious royal welcome from His Majesty King Philippe, King of the Belgians","Sa Majesté le Roi Philippe, Roi des Belges","and Her Royal Highness Princess Elisabeth, Duchess of Brabant, Crown Princess of Belgium","Son Altesse Royale la Princesse Élisabeth, Duchesse de Brabant","","Who have kindly addressed two official royal welcome letters, including welcoming the project on the territory of the Kingdom of Belgium, and believing in its vision. And as I raise this to your station, I raise it with pride in the leading role played by your prosperous Kingdom in supporting qualitative initiatives, and which makes the Kingdom of Belgium a proud partner of your high patronage, in a blessed land that shares with the Kingdom of Saudi Arabia and the Kingdom of Morocco the values of work and authenticity.","","Belgium is a respectable country with a King with a big heart, and I am honored to mention it in the same honorable station that Your Majesty and His Majesty the King of Morocco hold.","","Second - On the substance of the project:","","The project is to establish the strongest global company specialized in manufacturing and marketing gold and luxury jewelry, based on transforming gold into tangible luxury products, as the best safe investment, preserving the reputation of investors and the tranquility of investment funds, at a time when the world is witnessing fluctuations in interest rates and bonds.","","The philosophy of the project is that investment in tangible and luxurious assets is the real gain, and that working with the methodology of United Nations organizations is the way to success even in times of crisis.","","The project targets the segment of the wealthy and royal courts, and the fundamental question is who will be at the forefront of these supporting courts. And starting implementation with the two welcome letters from Belgium makes the authorities there ready to receive it.","","Third - What I request from your gracious station:","","I request from Your Majesty to kindly sponsor this project with your care, and with the care of the members of the gracious Saudi Royal Family, whether through gracious guidance to investors who know no impossible, from the titans of influence and immense wealth in the Kingdom, to direct their investments towards Belgium, in partnership, share and support, or through direct support from the esteemed Court according to what Your Majesty deems appropriate.","","And if direct support is not available, then gracious guidance from you towards those investment elites is enough to make it a global project, for it will not be global without you, my Lord.","","And I inform your station that I have not communicated regarding this project with the United Arab Emirates nor with China nor with other parties, except with the White House with the team of President Trump Administration, Trump Administration, and with the Moroccan Court, and the Belgian Court, and your prosperous Court as the King of the Islamic and Arab world.","","Please accept my utmost respect and appreciation,","Your loyal son","Rida Hamada"]},fr:{dir:"ltr",bismillah:"Au nom de Dieu, le Tout Miséricordieux, le Très Miséricordieux",lines:["Au nom de Dieu, le Tout Miséricordieux, le Très Miséricordieux","","À LA PRÉSENCE DE SA MAJESTÉ TRÈS ÉMINENTE","LE SERVITEUR DES DEUX SAINTES MOSQUÉES","LE ROI SALMANE BEN ABDELAZIZ AL SAOUD","Que Dieu le soutienne","","De : Rida Hamada - Royaume du Maroc","Objet : Demande de la Haute Orientation Gracieuse pour un projet industriel mondial dans l'or et la joaillerie - à partir du Royaume ami de Belgique","","Que la paix, la miséricorde et les bénédictions de Dieu soient sur vous,","","Mon Seigneur, Votre Majesté Très Éminente,","","J'ai l'honneur de soumettre cette lettre à votre haute présence, en espérant qu'elle reçoive votre bienveillante considération.","","Premièrement - Éloge du Royaume de Belgique :","","C'est un honneur de porter à la connaissance de votre présence que ce projet proposé a reçu un accueil royal gracieux de la part de Sa Majesté le Roi Philippe, Roi des Belges","Sa Majesté le Roi Philippe, Roi des Belges","et de Son Altesse Royale la Princesse Élisabeth, Duchesse de Brabant, Princesse héritière de Belgique","Son Altesse Royale la Princesse Élisabeth, Duchesse de Brabant","","Qui ont bien voulu adresser deux lettres royales officielles de bienvenue, comprenant l'accueil du projet sur le territoire du Royaume de Belgique, et la foi en sa vision. Et en élevant cela à votre présence, je l'élève avec fierté pour le rôle de premier plan que joue votre Royaume prospère dans le soutien aux initiatives qualitatives, et qui fait du Royaume de Belgique un partenaire fier de votre haute bienveillance, sur une terre bénie qui partage avec le Royaume d'Arabie Saoudite et le Royaume du Maroc les valeurs de travail et d'authenticité.","","La Belgique est un pays respectable avec un Roi au grand cœur, et je suis honoré de la mentionner dans la même présence honorable que portent Votre Majesté et Sa Majesté le Roi du Maroc.","","Deuxièmement - Sur le fond du projet :","","Le projet consiste à créer la plus forte entreprise mondiale spécialisée dans la fabrication et la commercialisation de l'or et de la joaillerie de luxe, basée sur la transformation de l'or en produits tangibles de luxe, comme le meilleur investissement sûr, préservant la réputation des investisseurs et la sérénité des fonds d'investissement, à un moment où le monde connaît des fluctuations des taux d'intérêt et des obligations.","","La philosophie du projet repose sur le fait que l'investissement dans des actifs tangibles et luxueux est le vrai gain, et que travailler avec la méthodologie des organisations des Nations Unies est la voie du succès même en temps de crise.","","Le projet cible le segment des fortunés et des cours royales, et la question fondamentale est de savoir qui sera à l'avant-garde de ces cours de soutien. Et le démarrage de la mise en œuvre avec les deux lettres de bienvenue de la Belgique rend les autorités là-bas prêtes à l'accueillir.","","Troisièmement - Ce que je sollicite de votre gracieuse présence :","","Je sollicite de Votre Majesté de bien vouloir parrainer ce projet par vos soins, et par les soins des membres de l'illustre Famille Royale Saoudienne, que ce soit par une orientation gracieuse vers des investisseurs qui ne connaissent pas l'impossible, parmi les titans de l'influence et de l'immense richesse du Royaume, pour orienter leurs investissements vers la Belgique, en partenariat, participation et soutien, ou par un soutien direct de la Cour vénérée selon ce que Votre Majesté jugera approprié.","","Et si un soutien direct n'est pas disponible, une orientation gracieuse de votre part vers ces élites d'investissement suffit à en faire un projet mondial, car il ne sera pas mondial sans vous, mon Seigneur.","","Et je porte à la connaissance de votre présence que je n'ai pas communiqué au sujet de ce projet avec les Émirats Arabes Unis ni avec la Chine ni avec d'autres parties, si ce n'est avec la Maison Blanche auprès de l'équipe de l'Administration du Président Trump Trump Administration, et avec la Cour Marocaine, et la Cour Belge, et votre Cour prospère en tant que Roi du monde islamique et arabe.","","Veuillez agréer l'expression de mon profond respect et de ma haute considération,","Votre fils dévoué","Rida Hamada"]},vl:{dir:"ltr",bismillah:"In de naam van God, de Meest Barmhartige, de Meest Genadevolle",lines:["In de naam van God, de Meest Barmhartige, de Meest Genadevolle","","AAN DE AANWEZIGHEID VAN ZIJNE VERHEVEN MAJESTEIT","DE BEWAARDER VAN DE TWEE HEILIGE MOSKEEËN","KONING SALMAN BIN ABDULAZIZ AL SAUD","Moge God hem steunen","","Van: Rida Hamada - Koninkrijk Marokko","Onderwerp: Verzoek om de Genadige Hoge Leiding voor een wereldwijd industrieel project in goud en juwelen - vertrekkende vanuit het bevriende Koninkrijk België","","Vrede, barmhartigheid en zegeningen van God zij met u,","","Mijn Heer, Uwe Hoogst Verheven Majesteit,","","Ik heb de eer deze brief aan uw verheven aanwezigheid voor te leggen, in de hoop dat zij uw welwillende aandacht mag genieten.","","Ten eerste - Lof voor het Koninkrijk België:","","Het is een eer u ter kennis te brengen dat dit voorgestelde project een genadig koninklijk welkom heeft ontvangen van Zijne Majesteit Koning Filip, Koning der Belgen","Sa Majesté le Roi Philippe, Roi des Belges","en Hare Koninklijke Hoogheid Prinses Elisabeth, Hertogin van Brabant, Kroonprinses van België","Son Altesse Royale la Princesse Élisabeth, Duchesse de Brabant","","Die welwillend twee officiële koninklijke welkomstbrieven hebben gericht, die het verwelkomen van het project op het grondgebied van het Koninkrijk België inhielden, en het geloof in zijn visie. En terwijl ik dit tot uw aanwezigheid verhef, verhef ik het met trots op de leidende rol die uw welvarend Koninkrijk speelt in het ondersteunen van kwalitatieve initiatieven, en die het Koninkrijk België een trotse partner maakt van uw hoge zorg, in een gezegend land dat met het Koninkrijk Saoedi-Arabië en het Koninkrijk Marokko de waarden van arbeid en authenticiteit deelt.","","België is een respectabel land met een Koning met een groot hart, en ik voel mij vereerd het te vermelden in dezelfde eervolle aanwezigheid die Uwe Majesteit en Zijne Majesteit de Koning van Marokko dragen.","","Ten tweede - Over de kern van het project:","","Het project is de oprichting van het sterkste wereldwijde bedrijf gespecialiseerd in de vervaardiging en commercialisering van goud en luxe juwelen, gebaseerd op het omzetten van goud in tastbare luxeproducten, als de beste veilige investering, die de reputatie van investeerders en de rust van investeringsfondsen bewaart, in een tijd waarin de wereld schommelingen in rente en obligaties kent.","","De filosofie van het project is dat investeren in tastbare en luxueuze activa de echte winst is, en dat werken volgens de methodologie van de organisaties van de Verenigde Naties de weg naar succes is, zelfs in tijden van crisis.","","Het project richt zich op het segment van de vermogenden en de koninklijke hoven, en de fundamentele vraag is wie aan de voorhoede van deze ondersteunende hoven zal staan. En het starten van de uitvoering met de twee welkomstbrieven uit België maakt de autoriteiten daar klaar om het te ontvangen.","","Ten derde - Wat ik verzoek van uw genadige aanwezigheid:","","Ik verzoek Uwe Majesteit vriendelijk dit project te willen sponsoren met uw zorg, en met de zorg van de leden van de edele Saoedische Koninklijke Familie, hetzij via een genadige leiding naar investeerders die het onmogelijke niet kennen, van de titanen van invloed en immense rijkdom in het Koninkrijk, om hun investeringen naar België te richten, in partnerschap en aandeel en steun, of via directe steun van het vereerde Hof volgens wat Uwe Majesteit passend acht.","","En indien directe steun niet beschikbaar is, is een genadige leiding van u naar die investeringselite voldoende om er een wereldwijd project van te maken, want het zal niet wereldwijd zijn zonder u, mijn Heer.","","En ik breng ter kennis van uw aanwezigheid dat ik over dit project niet heb gecommuniceerd met de Verenigde Arabische Emiraten noch met China noch met andere partijen, behalve met het Witte Huis bij het team van de Administratie van President Trump Trump Administration, en met het Marokkaanse Hof, en het Belgische Hof, en uw welvarend Hof als Koning van de islamitische en Arabische wereld.","","Aanvaard alstublieft mijn diepste respect en waardering,","Uw toegewijde zoon","Rida Hamada"]}};function bu(){let[e,t]=Rt.useState("ar"),[n,r]=Rt.useState(0),[l,o]=Rt.useState(null),[u,i]=Rt.useState(0);Rt.useEffect(()=>{r((d)=>d+1)},[e]);let s=ir[e],c=e==="ar";return F("div",{dir:s.dir,style:{backgroundColor:"#082820",minHeight:"100vh",fontFamily:c?"'Amiri', 'Scheherazade New', serif":"'Amiri', 'Scheherazade New', serif"},className:"relative w-full",children:[E("style",{children:`
